name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bootstrap_release_keystore:
        description: "Tạo keystore mới và lưu KETNOI_RELEASE_* secrets"
        required: false
        default: false
        type: boolean
      build_signed_release_apk:
        description: "Build APK release đã ký từ KETNOI_RELEASE_* secrets"
        required: false
        default: false
        type: boolean
      publish_release_from_run:
        description: "Tạo GitHub Release từ artifact APK của một workflow run thành công"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Tag GitHub Release cần tạo, ví dụ v1.0.2"
        required: false
        type: string
      artifact_run_id:
        description: "ID workflow run chứa signed APK artifact"
        required: false
        type: string
      artifact_name:
        description: "Tên signed APK artifact cần phát hành"
        required: false
        type: string

permissions:
  contents: read

jobs:
  bootstrap-release-keystore:
    name: Create secure Android release keystore
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_release_keystore }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONS_SECRETS_TOKEN: ${{ secrets.ACTIONS_SECRETS_TOKEN }}

    steps:
      - name: Verify token availability
        run: |
          set -euo pipefail
          test -n "$ACTIONS_SECRETS_TOKEN"

      - name: Create and store release keystore
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT
          STORE_PASSWORD="$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32)"
          KEY_ALIAS="ketnoi"
          keytool -genkeypair -v \
            -keystore "$WORKDIR/ketnoi-release.p12" \
            -storetype PKCS12 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname 'CN=Ket Noi, OU=Mobile, O=Ket Noi, L=Ha Noi, ST=Ha Noi, C=VN' \
            -noprompt >/dev/null
          base64 -w 0 "$WORKDIR/ketnoi-release.p12" | GH_TOKEN="$ACTIONS_SECRETS_TOKEN" gh secret set KETNOI_RELEASE_KEYSTORE_B64 --repo "$REPOSITORY"
          printf '%s' "$STORE_PASSWORD" | GH_TOKEN="$ACTIONS_SECRETS_TOKEN" gh secret set KETNOI_RELEASE_STORE_PASSWORD --repo "$REPOSITORY"
          printf '%s' "$STORE_PASSWORD" | GH_TOKEN="$ACTIONS_SECRETS_TOKEN" gh secret set KETNOI_RELEASE_KEY_PASSWORD --repo "$REPOSITORY"
          printf '%s' "$KEY_ALIAS" | GH_TOKEN="$ACTIONS_SECRETS_TOKEN" gh secret set KETNOI_RELEASE_KEY_ALIAS --repo "$REPOSITORY"
          FINGERPRINT="$(keytool -list -v -keystore "$WORKDIR/ketnoi-release.p12" -storetype PKCS12 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}')"
          printf 'Release keystore stored. SHA-256 certificate fingerprint: %s\n' "$FINGERPRINT"

  publish-release-from-artifact:
    name: Publish signed APK to GitHub Release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release_from_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}

    steps:
      - name: Validate publishing inputs
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          test -n "$ARTIFACT_RUN_ID"
          test -n "$ARTIFACT_NAME"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Release $RELEASE_TAG already exists and is public." >&2
              exit 1
            fi
            echo "Continuing with existing draft release $RELEASE_TAG."
          fi

      - name: Download signed APK artifact
        run: |
          set -euo pipefail
          mkdir -p release-artifact
          gh run download "$ARTIFACT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir release-artifact
          APK="$(find release-artifact -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          if [ "$APK" != "release-artifact/app-release.apk" ]; then mv "$APK" release-artifact/app-release.apk; fi
          sha256sum release-artifact/app-release.apk

      - name: Create GitHub Release with APK asset
        run: |
          set -euo pipefail
          TITLE="Kết Nối ${RELEASE_TAG} — APK release đã ký"
          NOTES="APK Android release đã ký và xác minh từ GitHub Actions run ${ARTIFACT_RUN_ID}."
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-artifact/app-release.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" release-artifact/app-release.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi

  build-signed-release-apk:
    name: Build signed Android release APK
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_release_apk }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: true
      KETNOI_RELEASE_STORE_PASSWORD: ${{ secrets.KETNOI_RELEASE_STORE_PASSWORD }}
      KETNOI_RELEASE_KEY_ALIAS: ${{ secrets.KETNOI_RELEASE_KEY_ALIAS }}
      KETNOI_RELEASE_KEY_PASSWORD: ${{ secrets.KETNOI_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js and pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript
        run: pnpm check

      - name: Decode release keystore
        env:
          KETNOI_RELEASE_KEYSTORE_B64: ${{ secrets.KETNOI_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KETNOI_RELEASE_KEYSTORE_B64"
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/ketnoi-release.p12"
          printf '%s' "$KETNOI_RELEASE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          printf 'KETNOI_RELEASE_STORE_FILE=%s\n' "$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --non-interactive --no-install

      - name: Assemble signed release APK
        working-directory: android
        run: ./gradlew --no-daemon -I ../scripts/ketnoi-release-signing.init.gradle :app:assembleRelease

      - name: Verify APK signature
        working-directory: android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: ket-noi-signed-release-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js and pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify TypeScript
        run: pnpm check

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --non-interactive --no-install

      - name: Assemble installable debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ket-noi-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
